name: Continuous Integration

on:
  push:
    branches:
      - main
      - actions-*
    tags:
      - v*
  pull_request:
    branches-ignore:
      - actions-*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "ruby"
            standardrb: true
            yard: true
          - ruby: "4.0"
            appraisal: "sidekiq_8.x"
          - ruby: "3.4"
            appraisal: "sidekiq_8.0"
          - ruby: "3.2"
            appraisal: "sidekiq_7.x"
          - ruby: "3.1"
            appraisal: "sidekiq_7.0"
          - ruby: "3.0"
            appraisal: "sidekiq_6.x"
          - ruby: "2.7"
            appraisal: "sidekiq_6.0"
          - ruby: "2.6"
            appraisal: "sidekiq_5.x"
          - ruby: "2.5"
            appraisal: "sidekiq_5.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby CI
        uses: bdurand/github-actions/ruby-ci@b7560883d5f8557f5d69fe8bd82721bbb5ed76df # v1.0.4
        with:
          ruby: ${{ matrix.ruby }}
          appraisal: ${{ matrix.appraisal }}
          bundler: ${{ matrix.bundler }}
          standardrb: ${{ matrix.standardrb }}
          yard: ${{ matrix.yard }}
          frozen_strings: ${{ matrix.frozen_strings }}
